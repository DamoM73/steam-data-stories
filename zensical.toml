[project]
site_name = "Steam Data Stories"
site_description = "Tell data stories about Steam games with Python, Polars, Plotly and marimo, for Year 9/10 students."
site_author = "Damien Murtagh"
site_url = "https://damom73.github.io/steam-data-stories/"
repo_url = "https://github.com/DamoM73/steam-data-stories"
repo_name = "DamoM73/steam-data-stories"
copyright = "Content licensed under CC BY-NC-SA 4.0. Code licensed under GPLv3."
docs_dir = "docs"
extra_css = ["stylesheets/extra.css"]
extra_javascript = ["javascripts/scroll_top.js"]

nav = [
  { "Home" = "index.md" },
  { "Start" = [
    { "Introduction" = "start/introduction.md" },
    { "Setting Up" = "start/setup.md" },
  ] },
  { "Hook" = [
    { "1. What is a Data Story?" = "hook/01_data_story.md" },
    { "2. Exploring Our Data" = "hook/02_exploring_data.md" },
    { "3. Asking a Question Data Can Answer" = "hook/03_asking_questions.md" },
    { "4. Data, Privacy and Ethics" = "hook/04_privacy_ethics.md" },
  ] },
  { "Behind the Scenes" = [
    { "5. Choosing Columns and Rows" = "cleaning/05_select_filter.md" },
    { "6. Fixing Our Data" = "cleaning/06_fixing_data.md" },
  ] },
  { "Rising Insights" = [
    { "7. Making New Columns" = "insights/07_new_columns.md" },
    { "8. Summarising Groups" = "insights/08_summarising_groups.md" },
    { "9. Bar Charts and Histograms" = "insights/09_bar_histogram.md" },
    { "10. Box Plots and Better Charts" = "insights/10_better_charts.md" },
    { "11. Trends and Relationships" = "insights/11_trends_relationships.md" },
    { "12. Outliers and Predictions" = "insights/12_outliers_predictions.md" },
    { "13. Our Own Insights" = "insights/13_own_insights.md" },
  ] },
  { "Aha Moment" = [
    { "14. The Aha Moment" = "aha/14_aha_moment.md" },
  ] },
  { "Resolution" = [
    { "15. Publishing Our Data Story" = "resolution/15_publishing.md" },
    { "16. Presenting and Feedback" = "resolution/16_presenting.md" },
  ] },
  { "Reference" = [
    { "The Data Story Arc" = "reference/story_arc.md" },
    { "Finding Data" = "reference/data_sources.md" },
    { "Polars" = "reference/polars.md" },
    { "Plotly Express" = "reference/plotly.md" },
    { "marimo" = "reference/marimo.md" },
    { "Common Errors" = "reference/common_errors.md" },
    { "Hosting on a Class Server" = "reference/class_server.md" },
    { "Index of Topics" = "reference/index_of_topics.md" },
    { "Glossary" = "reference/glossary.md" },
    { "Licence" = "reference/licence.md" },
  ] },
]

[project.theme]
language = "en"
logo = "assets/logo_header.png"
favicon = "assets/favicon.ico"
features = [
  "content.code.copy",
  "content.code.select",
  "content.tabs.link",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.snippets.base_path = ["docs"]
pymdownx.snippets.check_paths = true
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true
